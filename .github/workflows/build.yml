name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Verify app modules import and the FastAPI app boots
        run: |
          python -c "import audit, cli, config, gate, gherkin_gen, ingestion, interrogation, jira_client, models, pipeline, report, scoring, webhook_service; assert webhook_service.app"
